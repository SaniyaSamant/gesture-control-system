<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gesture Control System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        table { margin: auto; border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ccc; padding: 10px; }
        th { background-color: #f2f2f2; }
        a.button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>🖐 Hand Gesture Control System</h2>
    <p>This system detects gestures using webcam and maps them to actions.</p>
    <table>
        <tr><th>Gesture</th><th>Mapped Action</th></tr>
        <tr><td>Index</td><td>Play/Pause Music</td></tr>
        <tr><td>Next</td><td>Next Tab</td></tr>
        <tr><td>Palm</td><td>Show Desktop</td></tr>
        <tr><td>Prev</td><td>Previous Tab</td></tr>
        <tr><td>ThumbDown</td><td>Open Chrome</td></tr>
        <tr><td>ThumbUp</td><td>Take Screenshot (saved locally)</td></tr>
        <tr><td>Two</td><td>Show Motivational Quote</td></tr>
    </table>
    <a class="button" href="/camera">▶️ Start Camera</a>
</body>
</html>
